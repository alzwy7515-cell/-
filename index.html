<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة مستواي PRO | نظام الإدارة المتكامل</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #334155; background: #161e2e; color: white; box-sizing: border-box; }
        .btn { padding: 12px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.3s; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-red { background: var(--danger); color: white; width: auto; padding: 5px 15px; }
        
        /* تنسيق الجدول */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(255,255,255,0.02); border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #334155; }
        th { background: var(--primary); color: white; }

        .hidden { display: none; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; }
        .badge { padding: 3px 8px; border-radius: 5px; font-size: 0.8rem; }
        .badge-wait { background: var(--warning); }
        .badge-ok { background: var(--success); }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-page" class="card">
        <h2 style="text-align: center;">مستواي <span style="color: var(--primary);">PRO</span></h2>
        
        <div id="login-view">
            <input type="email" id="login-email" placeholder="البريد الإلكتروني">
            <input type="password" id="login-pass" placeholder="كلمة المرور">
            <button class="btn btn-blue" onclick="login()">دخول</button>
            <p style="text-align: center;"><a href="#" onclick="forgotPassword()" style="color: var(--warning);">نسيت كلمة السر؟</a></p>
            <p style="text-align: center;">ليس لديك حساب؟ <a href="#" onclick="toggleAuth(true)" style="color: var(--primary);">سجل الآن</a></p>
        </div>

        <div id="register-view" class="hidden">
            <select id="reg-role" onchange="toggleRoleFields()">
                <option value="teacher">أنا معلم</option>
                <option value="student">أنا طالب</option>
            </select>
            <input type="text" id="reg-name" placeholder="الاسم الكامل">
            <input type="email" id="reg-email" placeholder="البريد الإلكتروني">
            <input type="password" id="reg-pass" placeholder="كلمة المرور">
            
            <div style="display:flex; gap:5px;">
                <select id="reg-country" style="flex:1;" onchange="updatePrefix()">
                    <option value="Libya" data-code="+218">ليبيا</option>
                    <option value="Egypt" data-code="+20">مصر</option>
                    <option value="Tunisia" data-code="+216">تونس</option>
                </select>
                <input type="text" id="reg-phone" style="flex:2;" placeholder="رقم الهاتف مع المفتاح (مثال: +218...)">
            </div>

            <div id="teacher-only">
                <input type="text" id="reg-subject" placeholder="المادة التي تدرسها">
            </div>

            <button class="btn btn-green" onclick="register()">إنشاء الحساب</button>
            <p style="text-align: center;"><a href="#" onclick="toggleAuth(false)" style="color: var(--primary);">العودة للدخول</a></p>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3 id="user-welcome">مرحباً</h3>
                <span id="user-role-badge" class="badge badge-ok"></span>
            </div>
            <button class="btn btn-red" onclick="logout()">خروج</button>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="showTab('main-tab')">الرئيسية</button>
            <button class="tab-btn" onclick="showTab('settings-tab')">الإعدادات</button>
        </div>

        <div id="teacher-view" class="hidden">
            <div class="card">
                <h3>إضافة درجة طالب</h3>
                <input type="text" id="s-name" placeholder="اسم الطالب">
                <input type="number" id="s-grade" placeholder="الدرجة">
                <button class="btn btn-blue" onclick="saveGrade()">حفظ في الجدول</button>
            </div>
            
            <div class="card">
                <h3>جدول الدرجات</h3>
                <table>
                    <thead><tr><th>الطالب</th><th>الدرجة</th><th>التاريخ</th><th>إجراء</th></tr></thead>
                    <tbody id="grades-table"></tbody>
                </table>
            </div>

            <div class="card">
                <h3>طلبات رؤية الدرجات (الطلاب)</h3>
                <div id="requests-list"></div>
            </div>
        </div>

        <div id="student-view" class="hidden">
            <div class="card">
                <h3>درجاتي</h3>
                <div id="student-status-msg">قم بطلب إذن من المعلم لرؤية درجاتك.</div>
                <button id="request-btn" class="btn btn-warning hidden" onclick="requestAccess()">طلب إذن رؤية الدرجات</button>
                <table id="student-grades-table" class="hidden">
                    <thead><tr><th>المادة</th><th>الدرجة</th><th>المعلم</th></tr></thead>
                    <tbody id="my-grades-body"></tbody>
                </table>
            </div>
        </div>

        <div id="settings-tab" class="hidden card">
            <h3>تعديل البيانات الشخصية</h3>
            <input type="text" id="set-name" placeholder="الاسم الجديد">
            <button class="btn btn-blue" onclick="updateName()">تحديث الاسم</button>
            <hr style="margin:20px 0; border:0; border-top:1px solid #334155;">
            <input type="password" id="set-pass" placeholder="كلمة مرور جديدة">
            <button class="btn btn-red" onclick="updatePassword()">تغيير كلمة المرور</button>
        </div>
    </div>
</div>

<script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyB0LvixlLqNCwmvcsknedR3Aa8wuPetDlo",
        authDomain: "mostaway-libya.firebaseapp.com",
        databaseURL: "https://mostaway-libya-default-rtdb.firebaseio.com",
        projectId: "mostaway-libya",
        storageBucket: "mostaway-libya.firebasestorage.app",
        messagingSenderId: "808814665672",
        appId: "1:808814665672:web:8fdeae9c1864179dfceafd"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // 1. إدارة الواجهة
    function toggleAuth(isReg) {
        document.getElementById('login-view').classList.toggle('hidden', isReg);
        document.getElementById('register-view').classList.toggle('hidden', !isReg);
    }

    function toggleRoleFields() {
        const role = document.getElementById('reg-role').value;
        document.getElementById('teacher-only').classList.toggle('hidden', role !== 'teacher');
    }

    // 2. التحقق من الهاتف والدولة
    function validatePhone() {
        const phone = document.getElementById('reg-phone').value;
        const countrySelect = document.getElementById('reg-country');
        const prefix = countrySelect.options[countrySelect.selectedIndex].getAttribute('data-code');
        
        if(!phone.startsWith(prefix)) {
            alert(`خطأ: رقم الهاتف يجب أن يبدأ بمفتاح الدولة المختارة (${prefix})`);
            return false;
        }
        return true;
    }

    // 3. نظام التسجيل
    function register() {
        if(!validatePhone()) return;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        const name = document.getElementById('reg-name').value;
        const role = document.getElementById('reg-role').value;

        auth.createUserWithEmailAndPassword(email, pass).then(res => {
            db.ref('users/' + res.user.uid).set({
                name, role, email,
                phone: document.getElementById('reg-phone').value,
                country: document.getElementById('reg-country').value,
                subject: role === 'teacher' ? document.getElementById('reg-subject').value : '',
                accessApproved: false
            });
        }).catch(e => alert(e.message));
    }

    function login() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        auth.signInWithEmailAndPassword(email, pass).catch(e => alert("خطأ في البيانات"));
    }

    function forgotPassword() {
        const email = document.getElementById('login-email').value;
        if(!email) return alert("اكتب بريدك أولاً لإرسال الرابط");
        auth.sendPasswordResetEmail(email).then(() => alert("تم إرسال رابط استعادة كلمة السر إلى Gmail")).catch(e => alert(e.message));
    }

    // 4. نظام لوحة التحكم
    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-page').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadUserData(user.uid);
        } else {
            document.getElementById('auth-page').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }
    });

    function loadUserData(uid) {
        db.ref('users/' + uid).on('value', snap => {
            const data = snap.val();
            document.getElementById('user-welcome').innerText = `أهلاً يا ${data.name}`;
            document.getElementById('user-role-badge').innerText = data.role === 'teacher' ? 'معلم' : 'طالب';
            
            if(data.role === 'teacher') {
                document.getElementById('teacher-view').classList.remove('hidden');
                loadGradesTable(uid);
                loadRequests();
            } else {
                document.getElementById('student-view').classList.remove('hidden');
                checkStudentAccess(uid, data.accessApproved);
            }
        });
    }

    // 5. وظائف المعلم (الجدول والطلبات)
    function saveGrade() {
        const name = document.getElementById('s-name').value;
        const grade = document.getElementById('s-grade').value;
        db.ref(`grades/${auth.currentUser.uid}`).push({ name, grade, date: new Date().toLocaleDateString() });
        document.getElementById('s-name').value = ''; document.getElementById('s-grade').value = '';
    }

    function loadGradesTable(uid) {
        db.ref(`grades/${uid}`).on('value', snap => {
            const table = document.getElementById('grades-table');
            table.innerHTML = '';
            snap.forEach(c => {
                const g = c.val();
                table.innerHTML += `<tr><td>${g.name}</td><td>${g.grade}</td><td>${g.date}</td>
                <td><button class="btn-red" onclick="deleteGrade('${c.key}')">حذف</button></td></tr>`;
            });
        });
    }

    function loadRequests() {
        db.ref('users').orderByChild('role').equalTo('student').on('value', snap => {
            const list = document.getElementById('requests-list');
            list.innerHTML = '';
            snap.forEach(c => {
                const s = c.val();
                if(s.requestAccess === true && s.accessApproved === false) {
                    list.innerHTML += `<div class="student-item" style="display:flex; justify-content:space-between; margin-bottom:10px; background:#161e2e; padding:10px; border-radius:10px;">
                        <span>الطالب: ${s.name} يطلب رؤية درجاته</span>
                        <button class="btn-green" style="width:auto; padding:5px 10px;" onclick="approveAccess('${c.key}')">موافقة</button>
                    </div>`;
                }
            });
        });
    }

    function approveAccess(sid) { db.ref(`users/${sid}`).update({ accessApproved: true, requestAccess: false }); }

    // 6. وظائف الطالب (رؤية الدرجات)
    function checkStudentAccess(uid, approved) {
        const msg = document.getElementById('student-status-msg');
        const btn = document.getElementById('request-btn');
        if(approved) {
            msg.innerText = "تمت الموافقة! إليك درجاتك:";
            btn.classList.add('hidden');
            document.getElementById('student-grades-table').classList.remove('hidden');
            loadMyGrades();
        } else {
            btn.classList.remove('hidden');
        }
    }

    function requestAccess() { db.ref(`users/${auth.currentUser.uid}`).update({ requestAccess: true }); alert("تم إرسال الطلب للمعلم"); }

    function loadMyGrades() {
        // هنا نجلب الدرجات المرتبطة باسم الطالب من كل المعلمين (تبسيطاً)
        db.ref('grades').on('value', snap => {
            const body = document.getElementById('my-grades-body');
            body.innerHTML = '';
            snap.forEach(teacherSnap => {
                teacherSnap.forEach(gradeSnap => {
                    const g = gradeSnap.val();
                    // ملاحظة: في النسخة المتقدمة نربط بالـ UID، هنا نربط بالاسم للتبسيط
                    body.innerHTML += `<tr><td>عام</td><td>${g.grade}</td><td>معلم المنظومة</td></tr>`;
                });
            });
        });
    }

    // 7. الإعدادات
    function updateName() {
        const newName = document.getElementById('set-name').value;
        db.ref(`users/${auth.currentUser.uid}`).update({ name: newName }).then(() => alert("تم تحديث الاسم"));
    }

    function updatePassword() {
        const newPass = document.getElementById('set-pass').value;
        auth.currentUser.updatePassword(newPass).then(() => alert("تم تغيير كلمة المرور")).catch(e => alert(e.message));
    }

    function showTab(tabId) {
        document.getElementById('main-tab-view').classList.toggle('hidden', tabId !== 'main-tab'); // تحتاج لإضافة IDs للتبويبات
        document.getElementById('settings-tab').classList.toggle('hidden', tabId !== 'settings-tab');
    }

    function logout() { auth.signOut().then(() => location.reload()); }
</script>
</body>
</html>
