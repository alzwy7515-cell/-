<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحمد الزوي | منصة مستواي الذكية</title>
    
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #3b82f6; --accent: #10b981; --warning: #f59e0b; --bg: #050a18; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: white; min-height: 100vh; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px; padding: 25px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .header { text-align: center; margin-bottom: 25px; }
        .logo { width: 65px; height: 65px; background: linear-gradient(135deg, var(--primary), #1d4ed8); border-radius: 18px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: bold; box-shadow: 0 8px 15px rgba(59, 130, 246, 0.3); }
        .tool-card { background: rgba(255,255,255,0.05); border-radius: 22px; padding: 18px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        h2 { font-size: 1rem; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        input { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 12px; border: 1px solid #1e293b; background: #0f172a; color: white; text-align: center; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; margin-top: 10px; }
        #preview-img { width: 100%; border-radius: 12px; margin-top: 12px; display: none; border: 2px solid var(--primary); }
        .status { font-size: 0.85rem; margin-top: 10px; color: var(--warning); text-align: center; background: rgba(245, 158, 11, 0.1); padding: 8px; border-radius: 8px; display: none; }
        .social-links { display: flex; justify-content: center; gap: 25px; margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .social-links a { color: #94a3b8; font-size: 1.4rem; transition: 0.3s; }
        .social-links a:hover { color: var(--primary); transform: translateY(-3px); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">أ ز</div>
        <h1 style="font-size: 1.5rem;">مستواي الذكي</h1>
        <p style="color: #94a3b8; font-size: 0.85rem;">بوابة م. أحمد الزوي للحلول البرمجية</p>
    </div>

    <div class="tool-card">
        <h2><i class="fas fa-microchip"></i> تحليل الأوراق (الذكاء الاصطناعي)</h2>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" style="display: none;">
        <button class="btn btn-primary" onclick="document.getElementById('imageInput').click()">
            <i class="fas fa-image"></i> ارفع صورة الورقة
        </button>
        <img id="preview-img" src="#" alt="معاينة">
        <div id="ocr-status" class="status"></div>
        <button id="scan-btn" class="btn btn-accent" style="display:none;" onclick="processImage()">
            <i class="fas fa-sync-alt"></i> معالجة واستخراج PDF
        </button>
    </div>

    <div class="tool-card">
        <h2><i class="fas fa-calculator"></i> حاسبة المعدل السريع</h2>
        <input type="number" class="grade" placeholder="المادة 1">
        <input type="number" class="grade" placeholder="المادة 2">
        <input type="number" class="grade" placeholder="المادة 3">
        <button class="btn btn-primary" onclick="calculateFinalGPA()">احسب معدلي الآن</button>
        <div id="gpa-result" style="text-align:center; margin-top:12px; font-weight:bold; color:var(--accent);"></div>
    </div>

    <div class="social-links">
        <a href="https://www.facebook.com/share/1865YBfJcC/" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="https://www.snapchat.com/add/ly75o_0" target="_blank"><i class="fab fa-snapchat"></i></a>
    </div>

    <p style="text-align:center; font-size:0.7rem; color:#475569; margin-top:20px;">
        جميع الحقوق محفوظة © 2026 | أحمد الزوي
    </p>
</div>

<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('preview-img');
            output.src = reader.result;
            output.style.display = 'block';
            document.getElementById('scan-btn').style.display = 'flex';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    async function processImage() {
        const status = document.getElementById('ocr-status');
        const btn = document.getElementById('scan-btn');
        status.style.display = 'block';
        status.innerText = "جاري تشغيل محرك الذكاء الاصطناعي.. (قد يستغرق 30 ثانية لأول مرة)";
        btn.disabled = true;

        try {
            // استخدام رابط الـ CDN المباشر لتسريع التحميل
            const worker = await Tesseract.createWorker();
            await worker.loadLanguage('ara+eng');
            await worker.initialize('ara+eng');
            
            status.innerText = "جاري قراءة النصوص من الورقة حالياً..";
            const { data: { text } } = await worker.recognize(document.getElementById('preview-img').src);
            
            await worker.terminate();

            if (text.trim().length < 5) {
                status.innerText = "النص غير واضح، يرجى تصوير الورقة بشكل أقرب.";
            } else {
                status.innerText = "تم التحليل بنجاح! جاري تحميل ملف PDF..";
                generatePDF(text);
            }
        } catch (e) {
            status.innerText = "حدث خطأ في الاتصال بالذكاء الاصطناعي. حاول مرة أخرى.";
        } finally {
            btn.disabled = false;
        }
    }

    function generatePDF(content) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("تقرير تصحيح - منصة مستواي", 105, 20, { align: "center" });
        doc.text("النتائج المستخرجة:", 10, 40);
        const splitText = doc.splitTextToSize(content, 180);
        doc.text(splitText, 10, 50);
        doc.save("Mustaway_Report.pdf");
    }

        const grades = document.querySelectorAll('.grade');
        let sum = 0, count = 0;
        grades.forEach(input => { if(input.value !== "") { sum += parseFloat(input.value
