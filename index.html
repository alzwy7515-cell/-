<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة مستواي PRO | الإصدار المستقر</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; --accent: #8b5cf6; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .btn { padding: 12px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .hidden { display: none; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #334155; }
        .tab { padding: 10px; cursor: pointer; color: #94a3b8; }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); font-weight: bold; }
        .grade-fail { color: var(--danger) !important; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #334155; text-align: center; }
        th { background: rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-section" class="card">
        <h2 style="text-align: center;">مستواي <span style="color: var(--primary);">PRO</span></h2>
        
        <div id="login-view">
            <input type="email" id="login-email" placeholder="البريد الإلكتروني">
            <input type="password" id="login-pass" placeholder="كلمة المرور">
            <button class="btn btn-blue" onclick="login()">دخول</button>
            <button class="btn btn-outline" onclick="toggleAuth(true)">إنشاء حساب جديد</button>
        </div>

        <div id="register-view" class="hidden">
            <input type="text" id="reg-name" placeholder="الاسم الرباعي">
            <input type="email" id="reg-email" placeholder="البريد الإلكتروني">
            <input type="password" id="reg-pass" placeholder="كلمة المرور">
            <div style="display:flex; gap:5px;">
                <select id="reg-country" style="flex:1"><option value="LY" data-pre="+218" data-len="9">ليبيا</option></select>
                <input type="number" id="reg-phone" style="flex:2" placeholder="رقم الهاتف">
            </div>
            <button class="btn btn-green" onclick="register()">إتمام التسجيل</button>
            <button class="btn btn-outline" onclick="toggleAuth(false)">العودة للدخول</button>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <div class="nav-tabs">
            <div class="tab active" onclick="switchTab('main')">السجل</div>
            <div class="tab" onclick="switchTab('settings')">الإعدادات والذكاء</div>
        </div>

        <div id="view-main">
            <div class="card">
                <h3>توليد كشف درجات</h3>
                <input type="text" id="subject-name" placeholder="اسم المادة">
                <select id="grade-system"><option value="100">مئوي (100%)</option><option value="4">معدل (4.0)</option></select>
                <input type="number" id="std-count" placeholder="عدد الطلاب" value="1">
                <button class="btn btn-blue" onclick="generateTable()">إنشاء الجدول</button>
            </div>

            <div id="table-card" class="card hidden">
                <input type="text" id="search-box" placeholder="🔎 ابحث عن طالب..." onkeyup="searchTable()" style="background:#0f172a">
                <div style="overflow-x:auto">
                    <table id="main-table">
                        <thead><tr><th>الاسم</th><th>مشاركة</th><th>اختبار 1</th><th>اختبار 2</th><th>نهائي</th><th>المجموع</th></tr></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-settings" class="hidden">
            <div class="card">
                <h3>الملف الشخصي</h3>
                <input type="text" id="profile-name" placeholder="الاسم">
                <input type="text" id="profile-phone" placeholder="الهاتف">
                <button class="btn btn-blue" onclick="updateProfile()">حفظ البيانات</button>
                <button class="btn btn-outline" style="color:var(--danger); border-color:var(--danger)" onclick="logout()">خروج</button>
            </div>
            <div class="card">
                <h3>حول المنظومة</h3>
                <p>الهدف: أتمتة سجلات المعلمين في ليبيا.</p>
                <p>ميزة التصحيح الذكي: <span style="color:var(--accent)">قريباً</span></p>
            </div>
        </div>
    </div>
</div>

<script>
    // تكوين Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyB0LvixlLqNCwmvcsknedR3Aa8wuPetDlo",
        authDomain: "mostaway-libya.firebaseapp.com",
        databaseURL: "https://mostaway-libya-default-rtdb.firebaseio.com",
        projectId: "mostaway-libya",
        storageBucket: "mostaway-libya.firebasestorage.app",
        messagingSenderId: "808814665672",
        appId: "1:808814665672:web:8fdeae9c1864179dfceafd"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // المصادقة
    function toggleAuth(isReg) {
        document.getElementById('login-view').classList.toggle('hidden', isReg);
        document.getElementById('register-view').classList.toggle('hidden', !isReg);
    }

    function register() {
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;
        
        if(!email || !pass || !name) return alert("يرجى ملء البيانات");

        auth.createUserWithEmailAndPassword(email, pass).then(res => {
            db.ref('users/' + res.user.uid).set({ name, phone });
        }).catch(e => alert(e.message));
    }

    function login() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        auth.signInWithEmailAndPassword(email, pass).catch(e => alert("خطأ في الدخول"));
    }

    function logout() { auth.signOut().then(() => location.reload()); }

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            db.ref('users/' + user.uid).once('value', s => {
                const d = s.val();
                if(d) {
                    document.getElementById('profile-name').value = d.name;
                    document.getElementById('profile-phone').value = d.phone;
                }
            });
        }
    });

    // إدارة الجدول
    function generateTable() {
        const count = document.getElementById('std-count').value;
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        for(let i=0; i<count; i++) {
            tbody.innerHTML += `
                <tr>
                    <td><input type="text" class="st-name" placeholder="اسم الطالب"></td>
                    <td><input type="number" class="st-p" value="0" oninput="calc(this)"></td>
                    <td><input type="number" class="st-e1" value="0" oninput="calc(this)"></td>
                    <td><input type="number" class="st-e2" value="0" oninput="calc(this)"></td>
                    <td><input type="number" class="st-f" value="0" oninput="calc(this)"></td>
                    <td class="st-total">0</td>
                </tr>`;
        }
        document.getElementById('table-card').classList.remove('hidden');
    }

    function calc(el) {
        const tr = el.closest('tr');
        const sys = document.getElementById('grade-system').value;
        const sum = (parseFloat(tr.querySelector('.st-p').value)||0) + 
                    (parseFloat(tr.querySelector('.st-e1').value)||0) + 
                    (parseFloat(tr.querySelector('.st-e2').value)||0) + 
                    (parseFloat(tr.querySelector('.st-f').value)||0);
        
        let res = sys === "4" ? ((sum/100)*4).toFixed(2) : sum;
        const out = tr.querySelector('.st-total');
        out.innerText = res;
        out.classList.toggle('grade-fail', res < (sys === "4" ? 2 : 50));
    }

    function searchTable() {
        const q = document.getElementById('search-box').value.toLowerCase();
        document.querySelectorAll('#table-body tr').forEach(r => {
            const n = r.querySelector('.st-name').value.toLowerCase();
            r.style.display = n.includes(q) ? '' : 'none';
        });
    }

    function switchTab(t) {
        document.getElementById('view-main').classList.toggle('hidden', t !== 'main');
        document.getElementById('view-settings').classList.toggle('hidden', t !== 'settings');
    }

    function updateProfile() {
        db.ref('users/' + auth.currentUser.uid).update({
            name: document.getElementById('profile-name').value,
            phone: document.getElementById('profile-phone').value
        }).then(() => alert("تم التحديث"));
    }
</script>
</body>
</html>
