<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>أحمد الزوي | الصفحة الشخصية الرسمية</title>
    <meta name="description" content="الموقع الرسمي لأحمد الزوي. تواصل معي عبر فيسبوك وسناب شات لمتابعة آخر التحديثات والنشاطات.">
    <meta name="keywords" content="أحمد الزوي, الزوي, ليبيا, الأبيار, بنغازي, فيسبوك أحمد الزوي, سناب شات أحمد الزوي">
    <meta name="author" content="أحمد الزوي">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a; /* لون ليلي عميق وفخم */
            color: white;
            padding: 20px;
            overflow-x: hidden;
        }

        .bg-animate {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #1e293b 0%, #0f172a 100%);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 35px;
            padding: 50px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .profile-initial {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 800;
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.2);
            border: 4px solid rgba(255,255,255,0.1);
        }

        h1 { font-size: 2rem; margin-bottom: 8px; font-weight: 700; color: #f8fafc; }
        .subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 35px; }

        .links-container { display: flex; flex-direction: column; gap: 18px; }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .facebook { background: #1877F2; color: white; }
        .snapchat { background: #FFFC00; color: #000; }

        .link-card:hover {
            transform: translateY(-4px);
            filter: brightness(1.1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .link-card i { font-size: 1.6rem; }
    </style>
</head>
<body>

    <div class="bg-animate"></div>

    <div class="container">
        <div class="profile-initial">أ</div>
        
        <h1>أحمد الزوي</h1>
        <p class="subtitle">تواصل معي عبر منصات التواصل الاجتماعي</p>

        <div class="links-container">
            <a href="https://www.facebook.com/share/1865YBfJcC/" class="link-card facebook" target="_blank">
                <i class="fab fa-facebook"></i>
                <span>فيسبوك</span>
                <i class="fas fa-external-link-alt" style="font-size: 0.8rem; opacity: 0.6;"></i>
            </a>

            <a href="https://www.snapchat.com/add/ly75o_0" class="link-card snapchat" target="_blank">
                <i class="fab fa-snapchat"></i>
                <span>سناب شات</span>
                <i class="fas fa-external-link-alt" style="font-size: 0.8rem; opacity: 0.4;"></i>
            </a>
        </div>
    </div>

</body>
</html>
