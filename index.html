<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة مستواي - نسخة التصدير الرسمي</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --primary: #3b82f6; --dark: #0f172a; --card: #1e293b; --excel: #107c10; --pdf: #e11d48; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--dark); color: white; padding-bottom: 50px; }
        .container { padding: 15px; max-width: 700px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
        .btn { padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .export-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-excel { background: var(--excel); color: white; }
        .btn-pdf { background: var(--pdf); color: white; }
        .student-item { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 8px; border-right: 4px solid var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin: 25px 0;">مستواي <span style="color:var(--primary)">Export</span></h2>

    <div id="auth-box" class="card">
        <h3>تسجيل الدخول / اشتراك</h3>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="btn btn-primary" onclick="processAuth()">دخول السحابة</button>
        <p style="text-align: center; font-size: 0.8rem; margin-top: 10px;">سيطلب منك رقم الهاتف والمدرسة عند أول تسجيل</p>
    </div>

    <div id="teacher-view" style="display:none;">
        <div class="card">
            <h4 id="school-info">المدرسة: جاري التحميل...</h4>
            <div class="export-group">
                <button class="btn btn-excel" onclick="exportToExcel()">
                    💾 تصدير Excel
                </button>
                <button class="btn btn-pdf" onclick="exportToPDF()">
                    📄 تصدير PDF
                </button>
            </div>
        </div>

        <div class="card">
            <h4>إضافة طالب</h4>
            <input type="text" id="std-name" placeholder="اسم الطالب الرباعي">
            <button class="btn btn-primary" onclick="addNewStudent()">+ إضافة للطيف التعليمي</button>
        </div>

        <div id="students-list"></div>
    </div>
</div>

<script>
    // --- إعدادات Firebase الخاصة بك يا بشمهندس أحمد ---
    const firebaseConfig = {
        apiKey: "AIzaSyB0LvixlLqNCwmvcsknedR3Aa8wuPetDlo",
        authDomain: "mostaway-libya.firebaseapp.com",
        databaseURL: "https://mostaway-libya-default-rtdb.firebaseio.com",
        projectId: "mostaway-libya",
        storageBucket: "mostaway-libya.firebasestorage.app",
        messagingSenderId: "808814665672",
        appId: "1:808814665672:web:8fdeae9c1864179dfceafd"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let allStudentsData = []; // لتخزين البيانات محلياً قبل التصدير
    let currentSchool = "";

    function processAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(email, pass).catch(err => {
            if(err.code === 'auth/user-not-found') {
                const school = prompt("اسم المدرسة:");
                const phone = prompt("رقم الهاتف:");
                auth.createUserWithEmailAndPassword(email, pass).then(res => {
                    db.ref('users/' + res.user.uid).set({ email, school, phone, role: 'teacher' });
                });
            }
        });
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('teacher-view').style.display = 'block';
            db.ref('users/' + user.uid).once('value', snap => {
                currentSchool = snap.val().school;
                document.getElementById('school-info').innerText = "مدرسة: " + currentSchool;
                loadStudents(currentSchool);
            });
        }
    });

    function loadStudents(school) {
        db.ref('schools/' + school + '/students').on('value', snap => {
            const list = document.getElementById('students-list');
            list.innerHTML = "";
            allStudentsData = [];
            snap.forEach(child => {
                const s = child.val();
                allStudentsData.push({ ...s, id: child.key });
                list.innerHTML += `
                    <div class="student-item">
                        <p><b>${s.name}</b></p>
                        <div style="display:flex; gap:10px; margin-top:5px;">
                            <input type="number" value="${s.grades.p}" onchange="updateMark('${school}','${child.key}','p',this.value)" placeholder="P">
                            <input type="number" value="${s.grades.m}" onchange="updateMark('${school}','${child.key}','m',this.value)" placeholder="M">
                            <input type="number" value="${s.grades.f}" onchange="updateMark('${school}','${child.key}','f',this.value)" placeholder="F">
                        </div>
                    </div>`;
            });
        });
    }

    function updateMark(school, id, type, val) {
        db.ref(`schools/${school}/students/${id}/grades/${type}`).set(parseFloat(val) || 0);
    }

    function addNewStudent() {
        const name = document.getElementById('std-name').value;
        if(name) {
            db.ref('schools/' + currentSchool + '/students').push({
                name: name,
                grades: { p:0, m:0, f:0 },
                status: 'locked'
            });
            document.getElementById('std-name').value = "";
        }
    }

    // --- وظائف التصدير (المميزات الجديدة) ---

    function exportToExcel() {
        if(allStudentsData.length === 0) return alert("لا توجد بيانات لتصديرها");
        
        const data = allStudentsData.map(s => ({
            "اسم الطالب": s.name,
            "المشاركة": s.grades.p,
            "نصفي": s.grades.m,
            "نهائي": s.grades.f,
            "المجموع": (s.grades.p + s.grades.m + s.grades.f)
        }));

        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "كشف الدرجات");
        XLSX.writeFile(wb, `كشف_درجات_${currentSchool}.xlsx`);
    }

    function exportToPDF() {
        if(allStudentsData.length === 0) return alert("لا توجد بيانات لتصديرها");

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'p', format: 'a4' });
        
        // دعم اللغة العربية (تحتاج ملف خط، هنا سنستخدم الخط الافتراضي مع ترتيب النص)
        doc.text(`كشف درجات مدرسة: ${currentSchool}`, 105, 15, { align: 'center' });

        const rows = allStudentsData.map(s => [
            (s.grades.p + s.grades.m + s.grades.f),
            s.grades.f,
            s.grades.m,
            s.grades.p,
            s.name
        ]);

        doc.autoTable({
            head: [['المجموع', 'النهائي', 'النصفي', 'المشاركة', 'اسم الطالب']],
            body: rows,
            startY: 25,
            styles: { font: 'Courier', halign: 'right' }, // ملاحظة: PDF يحتاج خطوط خاصة للعربية، الكوريير يدعم الأساسيات
            headStyles: { fillColor: [59, 130, 246] }
        });

        doc.save(`كشف_درجات_${currentSchool}.pdf`);
    }
</script>
</body>
</html>
