<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحمد الزوي | الصفحة الشخصية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a; /* خلفية سوداء فخمة */
            color: white;
            padding: 20px;
            overflow: hidden;
        }

        /* تأثير الخلفية المتحركة (خيوط ضوئية) */
        .bg-animate {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 200% 200%;
            animation: moveGradient 10s ease infinite;
            z-index: -1;
            opacity: 0.4;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 40px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 40px 60px rgba(0,0,0,0.5);
        }

        .profile-initial {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #fdbb2d, #b21f1f);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(253, 187, 45, 0.3);
        }

        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #fff; }
        .subtitle { color: #aaa; font-size: 0.9rem; margin-bottom: 30px; letter-spacing: 1px; }

        .links-container { display: flex; flex-direction: column; gap: 15px; }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 25px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* تنسيق فيسبوك */
        .facebook {
            background: #1877F2;
            color: white;
            box-shadow: 0 10px 20px rgba(24, 119, 242, 0.2);
        }

        /* تنسيق سناب شات */
        .snapchat {
            background: #FFFC00;
            color: #000;
            box-shadow: 0 10px 20px rgba(255, 252, 0, 0.2);
        }

        .link-card:hover {
            transform: translateY(-5px) scale(1.02);
            filter: brightness(1.1);
        }

        .link-card i { font-size: 1.5rem; }

    </style>
</head>
<body>

    <div class="bg-animate"></div>

    <div class="container">
        <div class="profile-initial">أ</div>
        
        <h1>أحمد الزوي</h1>
        <p class="subtitle">تواصل معي مباشرة</p>

        <div class="links-container">
        <a href="https://www.facebook.com/share/1865YBfJcC/" class="link-card facebook" target="_blank">
                <span>فيسبوك</span>
                <i class="fas fa-chevron-left" style="font-size: 0.8rem; opacity: 0.5;"></i>
            </a>

            <a href="https://www.snapchat.com/add/ly75o_0" class="link-card snapchat" target="_blank">
                <i class="fab fa-snapchat"></i>
                <span>سناب شات</span>
                <i class="fas fa-chevron-left" style="font-size: 0.8rem; opacity: 0.5;"></i>
            </a>
        </div>
    </div>

</body>
</html>
