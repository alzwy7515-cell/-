<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>درسي الأول في HTML</title>
    <style>
        /* هذا الجزء هو CSS لتجميل المظهر */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-10px);
        }
        h1 { color: #2c3e50; }
        p { color: #7f8c8d; line-height: 1.6; }
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>مرحباً بكم يا مبدعين! 👋</h1>
        <p>لقد صممنا هذه الصفحة معاً باستخدام لغة HTML. البرمجة ليست مجرد أكواد، بل هي وسيلة لصناعة المستقبل.</p>
        <a href="#" class="button">ابدأ رحلتك الآن</a>
    </div>

</body>
</html>
