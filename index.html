<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة مستواي PRO | ليبيا</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); }
        h2 { text-align: center; font-size: 1.8rem; margin-bottom: 5px; }
        h2 span { color: var(--primary); }
        .subtitle { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-top: 15px; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-blue:hover { background: #2563eb; }
        .error-msg { color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; font-size: 0.85rem; text-align: center; }
        .toggle-link { text-align: center; margin-top: 25px; font-size: 0.9rem; color: #94a3b8; }
        .toggle-link a { color: var(--primary); text-decoration: none; font-weight: bold; }
        #main-app { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-section" class="card">
        <h2>مستواي <span>PRO</span></h2>
        <div class="subtitle" id="auth-subtitle">المنظومة السحابية للمعلمين والطلبة</div>
        
        <div id="auth-error" class="error-msg"></div>

        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        
        <div id="reg-fields" style="display: none;">
            <input type="text" id="phone" placeholder="رقم الهاتف (اختياري)">
            <input type="text" id="school-name" placeholder="اسم المدرسة">
            <input type="text" id="city-name" placeholder="المدينة (مثال: الأبيار)">
        </div>

        <button id="auth-btn" class="btn btn-blue" onclick="handleAuth()">دخول المنظومة</button>
        
        <div class="toggle-link" id="toggle-area">
            ليس لديك حساب؟ <a href="#" onclick="toggleUI(true)">أنشئ حسابك الآن</a>
        </div>
    </div>

    <div id="main-app" class="card">
        <h3 id="welcome-msg" style="margin-bottom: 5px;">أهلاً بك</h3>
        <p id="school-info" style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;"></p>
        
        <div style="background: rgba(59, 130, 246, 0.1); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <p style="font-size: 0.85rem; margin: 0;">البيانات الآن مزامنة مع السحابة ✅</p>
        </div>

        <button class="btn" style="background: #334155; color: white;" onclick="logout()">تسجيل الخروج</button>
    </div>
</div>

<script>
    // 1. استبدل هذه النجوم بالقيم التي حصلت عليها من Firebase Console
    const firebaseConfig = {
        apiKey: "AIzaSyB0LvixlLqNCwmvcsknedR3Aa8wuPetDlo", 
        authDomain: "mostaway-libya.firebaseapp.com",
        databaseURL: "https://mostaway-libya-default-rtdb.firebaseio.com",
        projectId: "mostaway-libya",
        storageBucket: "mostaway-libya.appspot.com",
        messagingSenderId: "808814665672",
        appId: "1:808814665672:web:8fdeae9c1864179dfceafd"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let isSignUp = false;

    // تبديل الواجهة
    function toggleUI(signUp) {
        isSignUp = signUp;
        document.getElementById('auth-subtitle').innerText = signUp ? "إنشاء حساب جديد للمعلم" : "المنظومة السحابية للمعلمين والطلبة";
        document.getElementById('auth-btn').innerText = signUp ? "تفعيل الحساب" : "دخول المنظومة";
        document.getElementById('reg-fields').style.display = signUp ? "block" : "none";
        document.getElementById('toggle-area').innerHTML = signUp ? 
            'لديك حساب بالفعل؟ <a href="#" onclick="toggleUI(false)">دخول</a>' : 
            'ليس لديك حساب؟ <a href="#" onclick="toggleUI(true)">أنشئ حسابك الآن</a>';
    }

    // الدخول والتسجيل
    function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const errorBox = document.getElementById('auth-error');
        errorBox.style.display = 'none';

        if(!email || !pass) { showError("البريد وكلمة السر مطلوبان"); return; }

        if(isSignUp) {
            const school = document.getElementById('school-name').value;
            const city = document.getElementById('city-name').value;
            const phone = document.getElementById('phone').value;
            if(!school || !city) { showError("يرجى إكمال بيانات المدرسة والمدينة"); return; }

            // تعيين حالة الجلسة لتكون طويلة الأمد (تذكرني)
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
                return auth.createUserWithEmailAndPassword(email, pass);
            }).then(res => {
                db.ref('users/' + res.user.uid).set({
                    email, school, city, phone, role: 'teacher'
                });
            }).catch(err => showError("فشل التسجيل: " + err.message));

        } else {
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
                return auth.signInWithEmailAndPassword(email, pass);
            }).catch(err => showError("البريد أو كلمة السر غير صحيحة"));
        }
    }

    // مراقبة الدخول التلقائي
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            db.ref('users/' + user.uid).once('value').then(snap => {
                const data = snap.val();
                document.getElementById('welcome-msg').innerText = "أهلاً بك يا أستاذ";
                document.getElementById('school-info').innerText = `مدرسة: ${data.school} | ${data.city} | هاتف: ${data.phone || 'غير مسجل'}`;
            });
        }
    });

    function showError(msg) {
        const box = document.getElementById('auth-error');
        box.innerText = msg;
        box.style.display = 'block';
    }

    function logout() {
        auth.signOut().then(() => location.reload());
    }
</script>

</body>
</html>
