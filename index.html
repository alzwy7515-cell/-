<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة مستواي PRO | إدارة الطلاب</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --danger: #ef4444; --success: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; min-height: 100vh; }
        .container { max-width: 600px; margin: 20px auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        
        .password-container { position: relative; width: 100%; }
        .toggle-password { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; font-size: 1.2rem; z-index: 10; }

        input, select { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 1rem; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 1rem; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 1px solid #334155; color: #94a3b8; font-size: 0.8rem; padding: 5px 10px; width: auto; }
        
        #main-app { display: none; }
        .student-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 4px solid var(--primary); }
        .student-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .student-actions { display: flex; gap: 10px; }
        .action-btn { cursor: pointer; font-size: 0.9rem; padding: 5px 10px; border-radius: 5px; border: none; }
        .edit-btn { background: #f59e0b; color: white; }
        .delete-btn { background: var(--danger); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-section" class="card">
        <h2 style="text-align:center">مستواي <span style="color:var(--primary)">PRO</span></h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <div class="password-container">
            <input type="password" id="password" placeholder="كلمة المرور">
            <span class="toggle-password" onclick="togglePass()">👁️</span>
        </div>
        
        <div id="reg-fields" style="display: none;">
            <input type="text" id="phone" placeholder="رقم الهاتف (إجباري)" required>
            <input type="text" id="school-name" placeholder="اسم المدرسة">
            <select id="country-list">
                <option value="">اختر الدولة</option>
            </select>
            <input type="text" id="city-name" placeholder="المدينة">
        </div>

        <button id="auth-btn" class="btn btn-blue" onclick="handleAuth()">دخول المنظومة</button>
        <p style="text-align:center; font-size:0.9rem; margin-top:15px">
            <a href="#" onclick="toggleUI(true)" id="toggle-link" style="color:var(--primary); text-decoration:none">إنشاء حساب جديد</a>
        </p>
    </div>

    <div id="main-app">
        <div class="card">
            <h3 id="welcome-msg">مرحباً</h3>
            <button class="btn-outline" onclick="logout()">تسجيل خروج</button>
        </div>

        <div class="card">
            <h3>إضافة / تعديل طالب</h3>
            <input type="hidden" id="edit-id">
            <input type="text" id="student-name" placeholder="اسم الطالب">
            <input type="number" id="student-grade" placeholder="الدرجة">
            <button id="save-btn" class="btn btn-green" onclick="saveStudent()">حفظ البيانات</button>
        </div>

        <h3>قائمة الطلاب</h3>
        <div id="students-list"></div>
    </div>
</div>
