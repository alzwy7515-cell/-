<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة مستواي برو | م. أحمد الزوي</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #10b981; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; overflow-x: hidden; }

        /* القائمة الجانبية الذكية */
        .sidebar { width: 260px; background: var(--card); border-left: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; position: fixed; height: 100vh; right: 0; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; }
        .sidebar.closed { right: -260px; }
        .sidebar-header { padding: 2rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { list-style: none; padding: 1rem 0; }
        .nav-links li { padding: 1rem 1.5rem; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.3s; color: #94a3b8; font-weight: 500; }
        .nav-links li:hover, .nav-links li.active { background: rgba(59, 130, 246, 0.15); color: var(--primary); border-right: 4px solid var(--primary); }

        /* المحتوى الرئيسي المتجاوب */
        .main-content { margin-right: 260px; flex-grow: 1; padding: 2rem; width: calc(100% - 260px); transition: 0.4s; }
        .main-content.full { margin-right: 0; width: 100%; }

        /* زر القائمة للهواتف */
        .menu-toggle { position: fixed; top: 15px; right: 15px; background: var(--primary); border: none; color: white; padding: 10px; border-radius: 8px; cursor: pointer; display: none; z-index: 1100; }

        /* البطاقات والجداول */
        .card { background: var(--card); border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
